<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#1b2a22">
  <title>Revierplaner</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="locked">
  <!-- Anmeldung -->
  <div class="login" id="login" hidden>
    <form class="login-card" id="loginForm" autocomplete="on">
      <div class="login-logo">
        <svg viewBox="0 0 24 24"><path d="M8 3h8v6H8z"/><path d="M6.5 9h11"/><path d="M9 9L7 21M15 9l2 12M8.2 15h7.6"/></svg>
      </div>
      <h1>Revierplaner</h1>
      <p>Bitte melde dich an, um auf das Revier zuzugreifen.</p>
      <label class="field"><span>Name</span><input id="loginName" name="username" autocomplete="username" autocapitalize="none" required></label>
      <label class="field"><span>Passwort</span><input id="loginPass" name="password" type="password" autocomplete="current-password" required></label>
      <div class="login-error" id="loginError" hidden></div>
      <button type="submit" class="btn primary">Anmelden</button>
    </form>
  </div>

  <div id="map"></div>

  <!-- Kopfleiste -->
  <header class="topbar">
    <button class="revier-switch" id="revierSwitch" aria-haspopup="true">
      <span class="revier-label">Revier <span id="syncStatus" class="sync-status"></span></span>
      <span class="revier-name"><span id="revierName">–</span>
        <svg viewBox="0 0 24 24" class="chev"><path d="M6 9l6 6 6-6"/></svg>
      </span>
    </button>
    <nav class="top-actions">
      <button class="top-btn" id="btnDraw" title="Reviergrenze zeichnen">
        <svg viewBox="0 0 24 24"><path d="M4 6l7-3 9 4-2 11-10 3-4-7z"/><circle cx="4" cy="6" r="1.6"/><circle cx="11" cy="3" r="1.6"/><circle cx="20" cy="7" r="1.6"/></svg>
        <span>Grenze</span>
      </button>
      <button class="top-btn" id="btnInfo" title="Revier-Info">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>
        <span>Info</span>
      </button>
      <button class="top-btn" id="btnData" title="Export / Import">
        <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 19h16"/></svg>
        <span>Daten</span>
      </button>
    </nav>
  </header>

  <!-- Suche -->
  <form class="search" id="searchForm" autocomplete="off">
    <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input type="search" id="searchInput" placeholder="Ort suchen …" aria-label="Ort suchen">
  </form>

  <!-- Seitenbuttons rechts -->
  <div class="side-col">
  <div class="side-btns">
    <button class="round-btn" id="btnLayer" title="Kartenansicht wechseln">
      <svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/></svg>
    </button>
    <button class="round-btn" id="btnFilter" title="Filter">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2"/><circle cx="15" cy="12" r="2"/><circle cx="8" cy="18" r="2"/></svg>
    </button>
  </div>
  <div class="side-btns bottom">
    <button class="round-btn" id="btnFit" title="Auf Revier zoomen">
      <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
    </button>
    <button class="round-btn" id="btnLocate" title="Mein Standort">
      <svg viewBox="0 0 24 24"><path d="M21 3L3 10.5l7.5 3L14 21z"/></svg>
    </button>
  </div>
  </div>

  <button class="fab" id="btnAdd" title="Punkt hinzufügen" aria-label="Punkt hinzufügen">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <!-- Kompass & Wetter unten links -->
  <div class="hud">
    <button class="compass" id="compass" title="Kompass (antippen für Live-Ausrichtung)" aria-label="Kompass">
      <svg viewBox="0 0 100 100" class="compass-svg">
        <circle cx="50" cy="50" r="47" class="c-ring"/>
        <g id="compassRose">
          <g class="c-ticks">
            <path d="M50 7v7M50 86v7M7 50h7M86 50h7"/>
            <path d="M80.4 19.6l-3.5 3.5M19.6 80.4l3.5-3.5M19.6 19.6l3.5 3.5M80.4 80.4l-3.5-3.5" class="minor"/>
          </g>
          <g id="windArrow" class="c-wind" style="display:none">
            <path d="M50 12v40"/>
            <path d="M42 46l8 12 8-12z" class="head"/>
          </g>
          <text x="50" y="27" class="c-n">N</text>
          <text x="77" y="54" class="c-l">O</text>
          <text x="50" y="81" class="c-l">S</text>
          <text x="23" y="54" class="c-l">W</text>
        </g>
        <path d="M50 1l5 8h-10z" class="c-heading"/>
      </svg>
      <span class="compass-deg" id="compassDeg"></span>
    </button>
    <button class="weather" id="weatherBtn" title="Wetter im Revier">
      <span class="wx-icon" id="wxIcon">⛅</span>
      <span class="wx-text">
        <b id="wxTemp">–</b>
        <small id="wxWind">Wetter lädt …</small>
      </span>
    </button>
  </div>

  <!-- Hinweisleiste im Platzier-/Zeichenmodus -->
  <div class="mode-banner" id="modeBanner" hidden>
    <span id="modeText"></span>
    <button id="modeDone" hidden>Fertig</button>
    <button id="modeCancel">Abbrechen</button>
  </div>

  <!-- Leiste für ausgewählten Punkt -->
  <div class="sel-bar" id="selBar" hidden>
    <span class="type-dot" id="selDot"></span>
    <div class="grow">
      <div class="title" id="selName"></div>
      <div class="sub"><span id="selType"></span></div>
      <div class="hint">Ziehen zum Verschieben</div>
    </div>
    <button id="selEdit" title="Bearbeiten" aria-label="Bearbeiten"><svg viewBox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg></button>
    <button id="selDel" class="danger" title="Löschen" aria-label="Löschen"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>
    <button id="selClose" title="Schließen" aria-label="Auswahl aufheben"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>

  <!-- Bottom-Sheet (wird dynamisch befüllt) -->
  <div class="sheet-backdrop" id="sheetBackdrop" hidden></div>
  <section class="sheet" id="sheet" hidden role="dialog" aria-modal="true">
    <div class="sheet-handle"></div>
    <div id="sheetContent"></div>
  </section>

  <div class="toast" id="toast" hidden></div>
  <input type="file" id="importFile" accept=".geojson,.json,application/geo+json,application/json" hidden>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@geoman-io/leaflet-geoman-free@2.17.0/dist/leaflet-geoman.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
